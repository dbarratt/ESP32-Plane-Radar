; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

; Shrink mbedtls TLS RAM use (default 16KB in + 16KB out per session is too
; much on top of the 115KB radar frame sprite). Dynamic buffer frees the
; unused portion of each buffer once the real record size is known, and the
; smaller content-len caps let it shrink much further.
custom_sdkconfig =
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_PEER_CERT=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
