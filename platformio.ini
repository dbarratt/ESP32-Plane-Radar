; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

; NOTE: custom_sdkconfig is NOT usable here — for esp32-c3 on this platform
; version, Arduino ships as prebuilt static libs (tools/sdk/esp32c3, including
; a prebuilt libmbedtls.a), not an IDF component recompiled from project
; sdkconfig, so any custom_sdkconfig entries are silently ignored. Verified by
; inspecting framework-arduinoespressif32/tools/sdk/esp32c3/*/include/sdkconfig.h
; after a clean build with custom_sdkconfig set — the options never appeared.
; mbedtls's ~33KB (16KB in + 16KB out) per-session buffer requirement cannot be
; reduced this way; see src/services/adsb_client.cpp, which avoids TLS
; entirely for the ADS-B fetch instead.

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
